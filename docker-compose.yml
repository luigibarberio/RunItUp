services:
  db:
    image: postgres:16-alpine
    container_name: runitup_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Iniezione del database iniziale: tutti gli script SQL presenti in "db_scripts" saranno eseguiti al primo avvio del container
      - ./db_scripts:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: . # Dice a Compose di cercare il "Dockerfile" nella stessa cartella
    container_name: runitup_app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080" # Usa la variabile definita nell'env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./.env:/app/.env # Monta il file .env dentro il container
      - ./runitup_uploads:/root/runitup_media # Monta la cartella "runitup_uploads" dentro il container per gestire i file caricati dagli utenti
    depends_on:
      db: # Vincolo di avvio: Tomcat si accende SOLO dopo che il database è pronto
        condition: service_healthy

volumes:
  postgres_data: